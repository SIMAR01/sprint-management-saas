services:

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sprint-management
      - REDIS_URL=redis://redis:6379
      - SWAGGER_SERVER_URL=http://localhost:5000

    depends_on:
      - mongodb
      - redis

    command: npm run dev

  mongodb:
    image: mongo

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: